# The fork's own check, on GitHub-hosted runners.
#
# The upstream workflows run on Blacksmith runners, which this organization
# does not have, so their jobs never start here; they are disabled in the
# repository settings rather than edited, to keep upstream merges clean.
# This workflow runs the same ci/*.sh scripts on the PostgreSQL major the
# fork ships (18): a release build and an assert-enabled debug build, on both
# CPUs dhub2 deploys to.
name: dtonic-check

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "test/antithesis/**"
      - "test/integration/**"
      - "doc/**"
  pull_request:
    paths-ignore:
      - "test/antithesis/**"
      - "test/integration/**"
      - "doc/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "check (${{ matrix.cpu }}, 18, ${{ matrix.compiler }}, ${{ matrix.check_type }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: amd64, compiler: gcc, check_type: normal }
          - { cpu: arm64, compiler: clang, check_type: normal }
          - { cpu: amd64, compiler: clang, check_type: debug }
          - { cpu: arm64, compiler: gcc, check_type: debug }
    runs-on: ${{ matrix.cpu == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      LLVM_VER: 18
      CPU: ${{ matrix.cpu }}
      CHECK_TYPE: ${{ matrix.check_type }}
      PG_VERSION: 18
      COMPILER: ${{ matrix.compiler }}
    steps:
      - name: Checkout extension code into workspace directory
        uses: actions/checkout@v6
        with:
          path: orioledb

      - name: Get the required tag name
        shell: bash
        run: |
          echo "PGTAG=$(grep '^18: ' orioledb/.pgtags | cut -d' ' -f2-)" >> $GITHUB_ENV

      - name: Checkout PostgreSQL code into workspace directory
        uses: actions/checkout@v6
        with:
          repository: orioledb/postgres
          ref: ${{ env.PGTAG }}
          path: postgresql

      # The fork's code needs hooks the fork adds to orioledb/postgres
      # (docker/patches/postgres/*.patch, applied in name order, as the
      # Dockerfile does).
      - name: Apply the fork's PostgreSQL patches
        run: |
          for p in orioledb/docker/patches/postgres/*.patch; do
            echo "applying $p"
            patch -d postgresql -p1 --forward < "$p"
          done

      - name: Setup prerequisites
        run: bash ./orioledb/ci/prerequisites.sh

      - name: Build
        run: bash ./orioledb/ci/build.sh

      - name: Install post build prerequisites
        run: bash ./orioledb/ci/post_build_prerequisites.sh

      - name: Check
        timeout-minutes: 120
        run: bash ./orioledb/ci/check.sh

      - name: Check output
        run: bash ./orioledb/ci/check_output.sh
        if: ${{ success() || failure() }}

      - name: Upload tests diffs and logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_test.logs
          path: |
            ./orioledb/test/**/regression.diffs
            ./orioledb/test/**/isolation_filtered.diffs
            ./orioledb/test/tmp_check_t/*/logs/*log
            ./orioledb/test/tmp_check/log/*log
            ./orioledb/test/tmp_check_iso/log/*log
            ./orioledb/test/log/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Show stuck processes
        run: bash ./orioledb/ci/list_stuck.sh
        if: ${{ always() }}
